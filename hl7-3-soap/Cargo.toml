[package]
name = "hl7-3-soap"
version = "0.1.4"
authors = ["Joel Parker Henderson <joel@joelparkerhenderson.com>"]
edition = "2024"
rust-version = "1.95"
description = "HL7® v3 over SOAP: the envelope, faults, message carriage, WSDL, and acknowledgement evaluation that carry Health Level Seven (HL7) version 3 (v3) messages over HTTP. HL7 v3's own historically dominant transport. HL7®, and FHIR® are the registered trademarks of Health Level Seven International and their use of these trademarks does not constitute an endorsement by HL7. This project is an independent work."
license = "MIT OR Apache-2.0 OR BSD-3-Clause OR GPL-2.0-only OR GPL-3.0-only"
repository = "https://github.com/hl7-rust/hl7-rust"
readme = "README.md"
keywords = ["hl7", "healthcare", "soap", "v3", "wsdl"]
categories = ["network-programming", "parser-implementations", "encoding"]
include = [
    "src/**/*",
    "spec/**/*",
    "samples/**/*",
    # The tests ship too: a crate about a protocol is worth more with the
    # cases that pin the protocol down in the box.
    "tests/**/*",
    "/LICENSE.md",
    "/README.md",
]

# One dependency, and it is the XML reader shared with the other crates in
# this family that read XML. This crate deliberately does not depend on
# hl7-3 — a SOAP envelope is XML, and reading one requires no RIM
# knowledge beyond the names of a few elements. See spec/index.md §1.
[dependencies]
hl7-2-xml-lite-helper = { version = "0.1", path = "../hl7-2-xml-lite-helper" }
