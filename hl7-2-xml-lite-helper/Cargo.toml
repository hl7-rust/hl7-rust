[package]
name = "hl7-2-xml-lite-helper"
version = "0.2.0"
authors = ["Joel Parker Henderson <joel@joelparkerhenderson.com>"]
edition = "2024"
rust-version.workspace = true
description = "A small, dependency-free XML reader shared by the hl7-2 crates: elements, attributes, text, and nesting, for documents whose shape you already know, with namespace prefixes ignored rather than resolved. A helper for that family rather than a general-purpose parser. HL7®, and FHIR® are the registered trademarks of Health Level Seven International and their use of these trademarks does not constitute an endorsement by HL7. This project is an independent work."
license = "MIT OR Apache-2.0 OR BSD-3-Clause OR GPL-2.0-only OR GPL-3.0-only"
repository = "https://github.com/hl7-rust/hl7-rust"
readme = "README.md"
keywords = ["hl7", "xml", "parser", "minimal", "healthcare"]
categories = ["parser-implementations", "encoding"]
include = [
    "src/**/*",
    "spec/**/*",
    # The tests ship too. This crate's argument is that you can read it and
    # check it yourself; that is worth less if the checks are not in the box.
    "tests/**/*",
    "/LICENSE.md",
    "/README.md",
]

# Empty on purpose, and staying that way: a crate whose whole argument is
# that it is small enough to read cannot have dependencies you also have to
# read. See spec/index.md §5.
[dependencies]

# Criterion is a development dependency only: it is compiled for
# `cargo bench` and never linked into the library or the binary, so the
# runtime dependency list above is unchanged.
[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "parse"
harness = false
