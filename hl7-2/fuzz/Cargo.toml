[package]
name = "hl7-2-fuzz"
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
authors = ["Joel Parker Henderson <joel@joelparkerhenderson.com>"]
publish = false

# Its own workspace: the fuzzers need `libfuzzer-sys` and a nightly
# toolchain, neither of which belongs in the workspace above.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
hl7-2 = { path = ".." }

[[bin]]
name = "dictionary"
path = "fuzz_targets/dictionary.rs"
test = false
doc = false
bench = false

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = false

[profile.mutants]
inherits = "test"
debug = "none"
incremental = false
