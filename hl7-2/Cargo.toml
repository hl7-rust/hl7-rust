[package]
name = "hl7-2"
version = "0.3.0"
authors = ["Joel Parker Henderson <joel@joelparkerhenderson.com>"]
edition = "2024"
rust-version.workspace = true
description = "HL7® v2 (releases 2.1-2.9) for Rust: parse, navigate, validate, modify, and render Health Level Seven (HL7) version 2 messages, in three modes: generic, schema-based, and struct-based. Published as `hl7-2` (the name `hl7-v2` belongs to an unrelated crate); most users get it through the `hl7` umbrella crate instead, as `hl7::v2`. HL7®, and FHIR® are the registered trademarks of Health Level Seven International and their use of these trademarks does not constitute an endorsement by HL7. This project is an independent work."
license = "MIT OR Apache-2.0 OR BSD-3-Clause OR GPL-2.0-only OR GPL-3.0-only"
repository = "https://github.com/hl7-rust/hl7-rust"
keywords = ["hl7", "healthcare", "er7", "v2", "parser"]
categories = ["parser-implementations", "command-line-utilities"]

# The command keeps the name it documents, and the one the repository has.
[[bin]]
name = "hl7-v2"
path = "src/main.rs"

[dependencies]
# The ER7 encoding layer: parsing, delimiters, escape sequences, paths,
# rendering, batch splitting. This crate supplies the HL7 v2 dictionary on
# top of it — see spec/index.md §2.
er7 = "0.1.0"
# The `#[derive(FromHl7)]` / `#[derive(ToHl7)]` macros for struct mode. Off
# by default so the dependency-free build stays dependency-free; enabling
# `derive` pulls in syn and quote through this crate only.
# 0.1.3 is the first release with `#[hl7(crate = ...)]`, which this crate
# now documents (spec §6), so the requirement names it.
hl7-2-derive = { version = "0.2.0", path = "../hl7-2-derive", optional = true }

[features]
default = []
derive = ["dep:hl7-2-derive"]

# Criterion is a development dependency only: it is compiled for `cargo bench`
# and never linked into the library or the binary, so the runtime dependency
# list above is unchanged. The same version and feature set as the conversion
# crates, so one `cargo bench` at the workspace root builds one Criterion.
[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "parse"
harness = false
