[package]
name = "serde-hl7-v2"
version = "0.1.0"
authors = ["Joel Parker Henderson <joel@joelparkerhenderson.com>"]
edition = "2024"
rust-version.workspace = true
description = "Serde support for the `hl7-2` crate: serialize and deserialize Health Level Seven (HL7®) version 2 (v2) messages, generic-mode trees, and validation diagnostics with Serde, so they can flow through JSON, YAML, or any other Serde data format. HL7®, and FHIR® are the registered trademarks of Health Level Seven International and their use of these trademarks does not constitute an endorsement by HL7. This project is an independent work."
license = "MIT OR Apache-2.0 OR BSD-3-Clause OR GPL-2.0-only OR GPL-3.0-only"
repository = "https://github.com/hl7-rust/hl7-rust"
keywords = ["hl7", "serde", "healthcare", "v2", "serialization"]
categories = ["encoding", "parser-implementations"]

# Exactly two dependencies, and both are the point of this crate: `serde` is
# the trait vocabulary this crate implements against, and `hl7-2` is the
# value tree it wraps. See spec/03-dependencies-and-format-agnosticism/index.md.
# `default-features = false` keeps `hl7-2`'s opt-in `derive` feature off, so
# no proc-macro crate is pulled in through this one.
[dependencies]
serde = "1"
hl7-2 = { version = "0.3.0", path = "../hl7-2", default-features = false }

# serde_json is not a runtime dependency of this crate — it is deliberately
# format-agnostic — but it is the natural format to exercise in tests,
# doctests, and examples, so it appears only here.
[dev-dependencies]
serde_json = "1"
