[package]
name = "hl7-v2-xml-lite-helper"
version = "0.1.0"
authors = ["Joel Parker Henderson <joel@joelparkerhenderson.com>"]
edition = "2024"
description = "A small, dependency-free XML reader shared by the hl7-v2 crates: elements, attributes, text, and nesting, for documents whose shape you already know, with namespace prefixes ignored rather than resolved. A helper for that family rather than a general-purpose parser."
license = "MIT OR Apache-2.0 OR BSD-3-Clause OR GPL-2.0-only OR GPL-3.0-only"
repository = "https://github.com/hl7-rust/hl7-v2-xml-lite-helper"
readme = "README.md"
keywords = ["hl7", "xml", "parser", "minimal", "healthcare"]
categories = ["parser-implementations", "encoding"]
include = [
    "src/**/*",
    "spec/**/*",
    # The tests ship too. This crate's argument is that you can read it and
    # check it yourself; that is worth less if the checks are not in the box.
    "tests/**/*",
    "/LICENSE.md",
    "/README.md",
]

# Empty on purpose, and staying that way: a crate whose whole argument is
# that it is small enough to read cannot have dependencies you also have to
# read. See spec/index.md §5.
[dependencies]
