[package]
name = "hl7-3-derive"
version = "0.2.0"
authors = ["Joel Parker Henderson <joel@joelparkerhenderson.com>"]
edition = "2024"
rust-version.workspace = true
description = "Derive macro for the hl7-3 crate: #[derive(FromElement)] maps struct fields to Health Level Seven (HL7®) version 3 (v3) XML element attributes and children. Used through hl7-3's `derive` feature, not directly. HL7®, and FHIR® are the registered trademarks of Health Level Seven International and their use of these trademarks does not constitute an endorsement by HL7. This project is an independent work."
license = "MIT OR Apache-2.0 OR BSD-3-Clause OR GPL-2.0-only OR GPL-3.0-only"
repository = "https://github.com/hl7-rust/hl7-rust"
keywords = ["hl7", "healthcare", "derive", "v3", "macro"]
categories = ["parser-implementations", "development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[dependencies]
# The three crates every derive macro is built on. They are this crate's
# only dependencies, and they are compiled only when a caller opts in to
# the `derive` feature of `hl7-3` — the default build of that crate still
# has exactly one dependency.
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["derive", "parsing", "printing", "proc-macro"], default-features = false }

[dev-dependencies]
# Path only, deliberately: a proc-macro crate can only be tested by
# compiling code that uses it, so the tests need `hl7-3` — but `hl7-3`
# depends on this crate for its `derive` feature. Cargo allows that cycle
# through dev-dependencies, and a dev-dependency with no version is
# stripped when publishing, which is what stops the cycle from making
# either crate unpublishable.
hl7-3 = { path = "../hl7-3" }
