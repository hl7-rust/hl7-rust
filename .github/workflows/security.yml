# Supply-chain gate: cargo-deny scans the dependency tree for RUSTSEC
# advisories, disallowed licenses, banned crates, and untrusted sources,
# per the workspace's `deny.toml`. cargo-deny's advisory check uses the
# same RUSTSEC database as cargo-audit but also honours the
# `[advisories] ignore` policy in deny.toml, so it is the single gate
# here — the `fhir-rust` sibling's `fhir-security.yml` is the family
# pattern.
#
# `--all-features` is a global flag, so it precedes the subcommand.
# Without it the graph is the default features only.

name: security

on:
  push:
  pull_request:
  schedule:
    # Weekly, Monday 02:00 UTC — catches advisories filed after merge.
    - cron: '0 2 * * 1'

jobs:
  cargo-deny:
    name: cargo deny (advisories + licenses + bans + sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # `cache-bin` (on by default) restores ~/.cargo/bin, so the install
      # below is a no-op after the first run rather than a 2-4 minute build.
      # A distinct key keeps this job off the caches other jobs write.
      - uses: Swatinem/rust-cache@v2
        with:
          key: cargo-deny
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: Run cargo deny
        run: cargo deny --all-features check
