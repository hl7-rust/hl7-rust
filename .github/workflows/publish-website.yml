# Publish the website.
#
# https://hl7-rust.github.io is an *organization* GitHub Pages site, which
# GitHub only ever serves from a repository named `hl7-rust.github.io`. So the
# site cannot be published from this workspace directly, however much we would
# like it to be.
#
# This workflow closes that gap: `hl7-rust.github.io/` here is the source of
# truth, and every push to main that touches it mirrors the directory into the
# `hl7-rust/hl7-rust.github.io` repository. That repository's own
# `.github/workflows/deploy.yml` — which is the copy sitting in this directory,
# arriving at its root — then builds and deploys it.
#
# ## Why a GitHub App, and not something simpler
#
# The push needs three things at once, and only an App installation token has
# all three:
#
#   - It must be able to write `.github/workflows/deploy.yml`. A deploy key
#     cannot: GitHub refuses it with "refusing to allow an OAuth App to create
#     or update workflow ... without `workflow` scope". That rules the simplest
#     option out entirely, because the mirror carries that file.
#   - It must trigger the deploy on the far side. A push made with GITHUB_TOKEN
#     does not start workflow runs, so the deploy would never fire.
#   - It should not be able to reach anything else. The token below is minted
#     per run, expires in an hour, and is scoped to one repository.
#
# ## Setup
#
# A GitHub App owned by the hl7-rust organization, installed on the
# `hl7-rust.github.io` repository *only*, with repository permissions:
#
#   Contents:  Read and write     (the mirrored files)
#   Workflows: Read and write     (deploy.yml is one of them)
#
# Then, from the App's settings page, note its App ID and generate a private
# key, and put both here:
#
#   gh secret set WEBSITE_APP_ID          --repo hl7-rust/hl7-rust
#   gh secret set WEBSITE_APP_PRIVATE_KEY --repo hl7-rust/hl7-rust < key.pem
#
# Nothing org-wide changes, the installation can be revoked in one click, and
# every token it mints is logged against the App.

name: Publish the website

on:
  push:
    branches: [main]
    paths:
      - 'hl7-rust.github.io/**'
      - '.github/workflows/publish-website.yml'
  workflow_dispatch:

# Never two mirrors at once: they would race to push the same branch. Queue
# instead of cancelling, so an intermediate commit is not silently skipped.
concurrency:
  group: publish-website
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mirror:
    name: Mirror into hl7-rust.github.io
    runs-on: ubuntu-latest
    steps:
      - name: Mint a token for the website repository
        id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.WEBSITE_APP_ID }}
          private-key: ${{ secrets.WEBSITE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          # Scoped to the one repository this workflow writes to, so the token
          # cannot touch this workspace or anything else in the organization.
          repositories: hl7-rust.github.io

      - name: Check out this workspace
        uses: actions/checkout@v4

      - name: Check out the website repository
        uses: actions/checkout@v4
        with:
          repository: hl7-rust/hl7-rust.github.io
          path: .website
          token: ${{ steps.token.outputs.token }}
          # Full history, because this commits on top of it rather than
          # replacing it: the website repository keeps its own log.
          fetch-depth: 0

      - name: Mirror the directory
        run: |
          # Empty the checkout, then lay down exactly what this workspace
          # tracks. `git archive` emits tracked content only, so nothing
          # untracked or ignored — node_modules, build, .svelte-kit — can
          # reach the website repository even if a runner leaves some behind.
          # Emptying first is what makes a deletion here become a deletion
          # there; .git survives because it is never tracked.
          find .website -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          git archive HEAD:hl7-rust.github.io | tar -x -C .website

      - name: Commit and push, if anything changed
        working-directory: .website
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "The website repository already matches this workspace."
            exit 0
          fi

          git config user.name "hl7-rust website mirror"
          git config user.email "joel@joelparkerhenderson.com"
          git add --all

          # Name the source commit, so anyone reading the website
          # repository's log can find what produced a change.
          subject="$(git -C .. log -1 --format=%s "$SOURCE_SHA")"
          git commit --message "$subject" --message \
            "Mirrored from hl7-rust/hl7-rust@${SOURCE_SHA}, which is where this
          site's source lives. Do not commit here directly: the next mirror
          would overwrite it."

          git push
