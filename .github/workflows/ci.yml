# CI for the Rust workspace.
#
# The jobs run exactly the gates CONTRIBUTING.md ("Before you open a pull
# request") names, so what a document claims is what a machine enforces:
#
#   cargo test                                # unit and integration tests
#   cargo clippy --all-targets -- -D warnings # lint-clean
#   cargo fmt --check                         # formatting
#   cargo rustdoc --lib -- -W missing-docs    # every public item documented
#   cargo +1.95 check --workspace --all-targets   # the MSRV floor
#
# The MSRV toolchain below moves with the policy in
# spec/rust-msrv-n-minus-3/index.md: current stable minus three releases,
# pinned as `rust-version` in every member's Cargo.toml. When the pin moves,
# this file moves in the same change.
#
# Disk, not time, is the constraint these two build jobs manage. A local
# `target/` from ordinary development on this workspace already runs to
# 9 GB (`du -sh target/`, checked 2026-08-28) — a workspace `target/` is one
# shared directory across all fourteen members, not one per crate, so
# `cargo test`, `cargo clippy --all-targets`, and fourteen sequential
# `cargo rustdoc` passes all accumulate into the same place with nothing to
# release it between them. A GitHub-hosted runner's free space is a few
# times that, and it starts already spent on toolchains this workspace
# never touches (Android, .NET, Haskell, CodeQL). Both jobs that build Rust
# free that space before starting and clean cargo's own output as they go,
# rather than trusting there is always headroom to spare.

name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: fmt, clippy, test, rustdoc (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free preinstalled runner bloat
        run: .github/workflows/free-disk-space.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: cargo fmt --check
        run: cargo fmt --check
      - name: cargo clippy --all-targets -- -D warnings
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        run: cargo test
      - name: cargo clean, test artifacts no longer needed
        run: cargo clean
      - name: cargo rustdoc --lib -- -W missing-docs, per crate
        run: |
          set -eu
          for crate in \
            hl7 \
            hl7-2 \
            hl7-3 \
            hl7-3-derive \
            hl7-3-soap \
            hl7-2-derive \
            hl7-2-mllp \
            hl7-2-soap \
            hl7-2-from-er7-into-json \
            hl7-2-from-er7-into-xml \
            hl7-2-from-json-into-er7 \
            hl7-2-from-xml-into-er7 \
            hl7-2-from-xsd-into-json-dictionary \
            hl7-2-xml-lite-helper
          do
            cargo rustdoc -p "$crate" --lib -- -W missing-docs
            # A workspace has one shared target/, so each iteration's build
            # output would otherwise sit next to the other thirteen's for
            # the rest of the job. Free this crate's before moving on.
            cargo clean -p "$crate"
          done

  msrv:
    name: MSRV floor (1.95)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free preinstalled runner bloat
        run: .github/workflows/free-disk-space.sh
      - uses: dtolnay/rust-toolchain@1.95
      - name: cargo check --workspace --all-targets
        run: cargo check --workspace --all-targets

  trademarks:
    name: trademark fair-use rules (T1, T2, T3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bin/check-trademarks
        run: ./bin/check-trademarks

  docs:
    name: docs budget and link integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bin/check-docs
        run: ./bin/check-docs
