# CI for the Rust workspace.
#
# The jobs run exactly the gates CONTRIBUTING.md ("Before you open a pull
# request") names, so what a document claims is what a machine enforces:
#
#   cargo test                                # unit and integration tests
#   cargo clippy --all-targets -- -D warnings # lint-clean
#   cargo fmt --check                         # formatting
#   cargo rustdoc --lib -- -W missing-docs    # every public item documented
#   cargo +1.96 check --workspace --all-targets   # the MSRV floor
#
# The MSRV toolchain below moves with the policy in
# spec/rust-msrv-n-minus-2/index.md: current stable minus two releases,
# pinned once as `[workspace.package] rust-version` in the root Cargo.toml
# and inherited by every member as `rust-version.workspace = true`. When
# the pin moves, this file moves in the same change.
#
# The `site` job runs the same two commands a contributor is asked to run
# on hl7-rust.github.io before opening a pull request: `pnpm run check`
# and `pnpm run build`. Before this job existed, Dependabot's PRs against
# hl7-rust.github.io/package.json showed a green checkmark from the other
# jobs here even though none of them ever ran `pnpm` — the checkmark
# proved nothing about the site. Five such PRs were merged on that false
# signal and had to be re-verified by hand afterward (see tasks.md); this
# job closes the gap so the checkmark means what it looks like it means.
#
# The `sbom` job closes the "no SBOM" gap SECURITY.md, MAINTAINERS.md, and
# RFC.md §8 used to name unconditionally: `cargo cyclonedx` writes one
# CycloneDX 1.3 JSON document per crate, uploaded as a workflow artifact
# on every push and pull request. It is *generation*, not distribution —
# nothing attaches these documents to a crates.io release, because
# publishing itself is still a manual, untagged act (see MAINTAINERS.md's
# "No release automation"); a reviewer who wants the SBOM for a specific
# published version has to reconstruct it against that version's
# `Cargo.lock`, not download it from that release.
#
# Disk, not time, is the constraint these three build jobs manage. A local
# `target/` from ordinary development on this workspace already runs to
# 9 GB (`du -sh target/`, checked 2026-08-28) — a workspace `target/` is one
# shared directory across all fourteen members, not one per crate, so
# `cargo test`, `cargo clippy --all-targets`, and fourteen sequential
# `cargo rustdoc` passes all accumulate into the same place with nothing to
# release it between them. A GitHub-hosted runner's free space is a few
# times that, and it starts already spent on toolchains this workspace
# never touches (Android, .NET, Haskell, CodeQL). Every job that builds
# Rust frees that space before starting and cleans cargo's own output as
# it goes, rather than trusting there is always headroom to spare.

name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: fmt, clippy, test, rustdoc (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Free preinstalled runner bloat
        run: .github/workflows/free-disk-space.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: cargo fmt --check
        run: cargo fmt --check
      - name: cargo clippy --all-targets -- -D warnings
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        run: cargo test
      - name: cargo clean, test artifacts no longer needed
        run: cargo clean
      - name: cargo rustdoc --lib -- -W missing-docs, per crate
        run: |
          set -eu
          for crate in \
            hl7 \
            hl7-2 \
            hl7-3 \
            hl7-3-derive \
            hl7-3-soap \
            hl7-2-derive \
            hl7-2-mllp \
            hl7-2-soap \
            hl7-2-from-er7-into-json \
            hl7-2-from-er7-into-xml \
            hl7-2-from-json-into-er7 \
            hl7-2-from-xml-into-er7 \
            hl7-2-from-xsd-into-json-dictionary \
            hl7-2-xml-lite-helper
          do
            cargo rustdoc -p "$crate" --lib -- -W missing-docs
            # A workspace has one shared target/, so each iteration's build
            # output would otherwise sit next to the other thirteen's for
            # the rest of the job. Free this crate's before moving on.
            cargo clean -p "$crate"
          done

  msrv:
    name: MSRV floor (1.96)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Free preinstalled runner bloat
        run: .github/workflows/free-disk-space.sh
      - uses: dtolnay/rust-toolchain@1.96
      - name: cargo check --workspace --all-targets
        run: cargo check --workspace --all-targets

  sbom:
    name: CycloneDX SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Free preinstalled runner bloat
        run: .github/workflows/free-disk-space.sh
      - uses: dtolnay/rust-toolchain@stable
      # `cache-bin` (on by default) restores ~/.cargo/bin, so the install
      # below is a no-op after the first run rather than a 2-4 minute
      # build. A distinct key keeps this off the caches the checks/msrv
      # jobs write.
      - uses: Swatinem/rust-cache@v2
        with:
          key: cargo-cyclonedx
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked
      - name: Generate SBOM (one CycloneDX 1.3 JSON document per crate)
        run: cargo cyclonedx --format json --all
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: "*/*.cdx.json"

  trademarks:
    name: trademark fair-use rules (T1, T2, T3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: bin/check-trademarks
        run: ./bin/check-trademarks

  docs:
    name: docs budget and link integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: bin/check-docs
        run: ./bin/check-docs

  site:
    name: hl7-rust.github.io (check, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hl7-rust.github.io
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: hl7-rust.github.io/pnpm-lock.yaml
      - name: pnpm install --frozen-lockfile
        run: pnpm install --frozen-lockfile
      - name: pnpm run check
        run: pnpm run check
      - name: pnpm run build
        run: pnpm run build
