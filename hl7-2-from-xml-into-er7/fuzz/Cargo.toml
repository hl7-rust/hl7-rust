[package]
name = "hl7-2-from-xml-into-er7-fuzz"
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
authors = ["Joel Parker Henderson <joel@joelparkerhenderson.com>"]
publish = false

# Its own workspace: the fuzzers need `libfuzzer-sys` and a nightly
# toolchain, neither of which belongs in the workspace above. The forward
# crate is here so the pair can be fuzzed as the round trip it is.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
hl7-2-from-xml-into-er7 = { path = ".." }
hl7-2-from-er7-into-xml = { path = "../../hl7-2-from-er7-into-xml" }
er7 = "0.1"

[[bin]]
name = "convert"
path = "fuzz_targets/convert.rs"
test = false
doc = false
bench = false

[[bin]]
name = "roundtrip"
path = "fuzz_targets/roundtrip.rs"
test = false
doc = false
bench = false

# RCA-ENF-4: a backstop. Any operator the lints miss panics, which is detectable,
# instead of wrapping, which is not. RCA-P-1 still forbids the panic.
[profile.release]
overflow-checks = true

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = false

[profile.mutants]
inherits = "test"
debug = "none"
incremental = false
