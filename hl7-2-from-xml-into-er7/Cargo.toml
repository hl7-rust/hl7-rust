[package]
name = "hl7-2-from-xml-into-er7"
version = "0.6.4"
authors = ["Joel Parker Henderson <joel@joelparkerhenderson.com>"]
edition = "2024"
rust-version = "1.95"
description = "HL7® v2 from XML into ER7: Convert Health Level Seven (HL7) version 2 (v2) messages from Extensible Markup Language (XML) into Encoding Rules version 7 (ER7) a.k.a. pipe-delimited. HL7®, and FHIR® are the registered trademarks of Health Level Seven International and their use of these trademarks does not constitute an endorsement by HL7. This project is an independent work."
license = "MIT OR Apache-2.0 OR BSD-3-Clause OR GPL-2.0-only OR GPL-3.0-only"
repository = "https://github.com/hl7-rust/hl7-rust"
keywords = ["hl7", "healthcare", "xml", "er7", "v2xml"]
categories = ["parser-implementations", "command-line-utilities"]

[dependencies]
# The ER7 encoding layer: the value tree, escape sequences, and writing
# back out to the wire format. See spec/index.md §2.
er7 = "0.1.0"
# The XML reader, which this crate used to carry its own copy of. It has no
# dependencies of its own, so the audit surface is unchanged and there is
# one parser to read instead of three.
hl7-2-xml-lite-helper = { version = "0.1", path = "../hl7-2-xml-lite-helper" }

# Criterion is a development dependency only: it is compiled for
# `cargo bench` and never linked into the library or the binary, so the
# runtime dependency list above is unchanged.
[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "convert"
harness = false
