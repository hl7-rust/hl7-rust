[package]
name = "hl7-v2-from-xsd-into-json-dictionary"
version = "0.1.0"
authors = ["Joel Parker Henderson <joel@joelparkerhenderson.com>"]
edition = "2024"
description = "HL7 v2 from XSD into JSON dictionary: read a directory of HL7 version 2 (v2) XML Schema Definition (XSD) files — the v2.xml encoding, as published or as a vendor customised it — and write the JSON dictionary the hl7-v2 crates read."
license = "MIT OR Apache-2.0 OR BSD-3-Clause OR GPL-2.0-only OR GPL-3.0-only"
repository = "https://github.com/hl7-rust/hl7-rust"
readme = "README.md"
keywords = ["hl7", "healthcare", "xsd", "v2xml", "schema"]
categories = ["parser-implementations", "command-line-utilities", "encoding"]
include = [
    "src/**/*",
    "spec/**/*",
    "samples/**/*",
    "/LICENSE.md",
    "/README.md",
]

# The XML reader, which this crate used to carry its own copy of. The
# helper has no dependencies of its own, so the audit surface is unchanged
# and there is one parser to read instead of three. The JSON writer stays
# here: it writes one document shape and nothing else, which is not worth
# a crate. See spec/index.md §6.
[dependencies]
hl7-v2-xml-lite-helper = { version = "0.1", path = "../hl7-v2-xml-lite-helper" }

[dev-dependencies]
# The dictionaries this crate writes have to load in the crate that reads
# them, and the only honest way to test that is to load one.
hl7-v2 = { version = "0.2.0", path = "../hl7-v2", default-features = false }

[[bin]]
name = "hl7-v2-from-xsd-into-json-dictionary"
path = "src/main.rs"
