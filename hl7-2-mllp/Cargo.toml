[package]
name = "hl7-2-mllp"
version = "0.2.0"
authors = ["Joel Parker Henderson <joel@joelparkerhenderson.com>"]
edition = "2024"
rust-version.workspace = true
description = "HL7® v2 MLLP: the Minimal Lower Layer Protocol that frames Health Level Seven (HL7) version 2 (v2) messages on a TCP stream. Framing, streaming, acknowledgements, and a transport trait. HL7®, and FHIR® are the registered trademarks of Health Level Seven International and their use of these trademarks does not constitute an endorsement by HL7. This project is an independent work."
license = "MIT OR Apache-2.0 OR BSD-3-Clause OR GPL-2.0-only OR GPL-3.0-only"
repository = "https://github.com/hl7-rust/hl7-rust"
keywords = ["hl7", "healthcare", "mllp", "v2", "tcp"]
categories = ["network-programming", "parser-implementations"]

[dependencies]
# HL7 v2 itself, for turning a received frame into the acknowledgement HL7
# expects back (see spec/index.md §5). Optional, and default-on: framing is
# useful without it, and `default-features = false` gives a build with no
# dependencies at all.
hl7-2 = { version = "0.3.0", path = "../hl7-2", optional = true }
# Wall-clock timestamps for generated acknowledgements. Off by default: a
# message that invents its own timestamp is untestable, so the clock is
# opt-in and the explicit-timestamp call is always there.
chrono = { version = "0.4", optional = true, default-features = false, features = ["clock", "std"] }

# Both examples acknowledge, so they need the feature that can.
[[example]]
name = "tcp_listener"
required-features = ["ack"]

[[example]]
name = "tcp_sender"
required-features = ["ack"]

[features]
default = ["ack"]
# Generate HL7 acknowledgements from received frames.
ack = ["dep:hl7-2"]
# `acknowledge_now`: take the timestamp from the system clock.
clock = ["ack", "dep:chrono"]
# Accept the two framing sins real senders commit: a missing carriage
# return after the end block, and bytes between frames. Off by default —
# see spec/index.md §3.3.
noncompliance = []
