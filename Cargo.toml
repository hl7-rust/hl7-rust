[package]
name = "xml-to-hl7-2-5"
version = "0.1.0"
edition = "2024"
description = "Convert the HL7 v2.xml XML representation back to HL7 v2.5 messages (pipe-delimited ER7)"
license = "MIT OR Apache-2.0 OR BSD-3-Clause OR GPL-2.0-only OR GPL-3.0-only"
repository = "https://github.com/hl7-rust/xml-to-hl7-2-5-using-rust"
keywords = ["hl7", "healthcare", "xml", "er7", "v2xml"]
categories = ["parser-implementations", "command-line-utilities"]

[dependencies]
# The ER7 encoding layer: the value tree, escape sequences, and writing
# back out to the wire format. This crate supplies only the XML parser and
# the reconstruction rules on top of it — see spec/index.md §2.
er7 = "0.1.0"
