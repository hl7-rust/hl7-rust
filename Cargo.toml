[workspace]
resolver = "3"
members = [
  "hl7",
  "hl7-2",
  "hl7-3",
  "hl7-3-derive",
  "hl7-3-soap",
  "hl7-2-derive",
  "hl7-2-mllp",
  "hl7-2-soap",
  "hl7-2-from-er7-into-json",
  "hl7-2-from-er7-into-xml",
  "hl7-2-from-json-into-er7",
  "hl7-2-from-xml-into-er7",
  "hl7-2-from-xsd-into-json-dictionary",
  "hl7-2-xml-lite-helper",
]

# The one field every member inherits from the workspace — see
# spec/rust-msrv-n-minus-2/index.md. Everything else (edition, features,
# dependencies) stays per-crate, as AGENTS.md's working conventions still
# say: this is a narrow, deliberate exception for the single value that
# has to move in lockstep across all fourteen members, not a switch to
# `[workspace.dependencies]` inheritance generally.
[workspace.package]
rust-version = "1.96"
