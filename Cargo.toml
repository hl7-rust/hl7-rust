[workspace]
resolver = "3"
members = [
  "hl7",
  "hl7-2",
  "hl7-3",
  "hl7-3-derive",
  "hl7-3-soap",
  "hl7-2-derive",
  "hl7-2-mllp",
  "hl7-2-soap",
  "hl7-2-from-er7-into-json",
  "hl7-2-from-er7-into-xml",
  "hl7-2-from-json-into-er7",
  "hl7-2-from-xml-into-er7",
  "hl7-2-from-xsd-into-json-dictionary",
  "hl7-2-xml-lite-helper",
  "serde-hl7",
  "serde-hl7-v2",
  "serde-hl7-v3",
]

# The one field every member inherits from the workspace — see
# spec/rust-msrv-n-minus-2/index.md. Everything else (edition, features,
# dependencies) stays per-crate, as AGENTS.md's working conventions still
# say: this is a narrow, deliberate exception for the single value that
# has to move in lockstep across all seventeen members, not a switch to
# `[workspace.dependencies]` inheritance generally.
[workspace.package]
rust-version = "1.98"

# RCA-ENF-1: the checked-arithmetic lint set of spec/rust-checked-arithmetic.
# A member opts in with `[lints] workspace = true` once every module in it is
# converted (RCA-ENF-3); `tasks.md` tracks which members have. Test code may
# use plain operators, unwrap and expect (RCA-EXC-5): an integration-test,
# example or bench root, or a `#[cfg(test)]` module, that needs to says so
# with an `allow` carrying an "RCA-EXC-5" reason.
[workspace.lints.clippy]
# Arithmetic (RCA-INT, RCA-AGG, RCA-WIDE)
arithmetic_side_effects = "deny"
integer_division = "deny"
modulo_arithmetic = "deny"
default_numeric_fallback = "deny"
# Conversions (RCA-CONV)
as_conversions = "deny"
cast_lossless = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_precision_loss = "deny"
cast_sign_loss = "deny"
checked_conversions = "deny"
# Floats (RCA-FLT)
float_arithmetic = "deny"
float_cmp = "deny"
lossy_float_literal = "deny"
# Panics (RCA-P-1, RCA-NONE, RCA-LEN)
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
string_slice = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
# Exceptions must be expected, with a reason (RCA-EXC-6)
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

# RCA-ENF-4: a backstop. Any operator the lints miss panics, which is detectable,
# instead of wrapping, which is not. RCA-P-1 still forbids the panic.
[profile.release]
overflow-checks = true

# cargo-mutants builds every mutant once in a throwaway copy of the tree: no debug information and no
# incremental state make each build quicker and smaller. `.cargo/mutants.toml` selects it.
[profile.mutants]
inherits = "test"
debug = "none"
incremental = false

# Faster dev/test builds: keep line tables for backtraces, drop the rest of the debug info.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = false
