[package]
name = "hl7-v2-from-er7-into-xml"
version = "0.5.0"
authors = ["Joel Parker Henderson <joel@joelparkerhenderson.com>"]
edition = "2024"
description = "HL7 v2 from ER7 into XML: Convert Health Level Seven (HL7) version 2 (v2) messages from Encoding Rules version 7 (ER7) a.k.a. pipe-delimited into Extensible Markup Language (XML)."
license = "MIT OR Apache-2.0 OR BSD-3-Clause OR GPL-2.0-only OR GPL-3.0-only"
repository = "https://github.com/hl7-rust/hl7-v2-from-er7-into-xml"
keywords = ["hl7", "healthcare", "xml", "er7", "v2xml"]
categories = ["parser-implementations", "command-line-utilities"]

[dependencies]
# The ER7 encoding layer: parsing, escape sequences, and writing back out.
er7 = "0.1.0"
# The HL7 v2 dictionary: data types, segment field tables, message
# structures, and the matcher that groups segments. Until 0.5.0 this crate
# carried its own copies of the v2.5 tables; now it reads them from the
# dictionary, which is what lets a caller supply a vendor dialect instead of
# the bundled release — see spec/index.md §2 and §4. `default-features =
# false` drops MLLP, which conversion has no use for.
hl7-v2 = { version = "0.2.0", path = "../hl7-v2", default-features = false }
